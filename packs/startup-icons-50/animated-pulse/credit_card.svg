<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="pulse-credit_card">
<style>
  @keyframes pulse-credit_card {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }
  #pulse-credit_card {
    animation: pulse-credit_card 2s ease-in-out infinite;
    transform-origin: center center;
    transform-box: fill-box;
  }
</style><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>