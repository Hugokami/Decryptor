<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="pulse-activity">
<style>
  @keyframes pulse-activity {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }
  #pulse-activity {
    animation: pulse-activity 2s ease-in-out infinite;
    transform-origin: center center;
    transform-box: fill-box;
  }
</style><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
