<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="pulse-code">
<style>
  @keyframes pulse-code {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }
  #pulse-code {
    animation: pulse-code 2s ease-in-out infinite;
    transform-origin: center center;
    transform-box: fill-box;
  }
</style><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>