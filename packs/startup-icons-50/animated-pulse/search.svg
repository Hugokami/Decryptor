<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="pulse-search">
<style>
  @keyframes pulse-search {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }
