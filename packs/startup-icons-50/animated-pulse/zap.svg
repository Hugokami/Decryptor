<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="pulse-zap">
<style>
  @keyframes pulse-zap {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }
  #pulse-zap {
    animation: pulse-zap 2s ease-in-out infinite;
    transform-origin: center center;
    transform-box: fill-box;
  }
</style><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>