<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="pulse-smartphone">
<style>
  @keyframes pulse-smartphone {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }
  #pulse-smartphone {
    animation: pulse-smartphone 2s ease-in-out infinite;
    transform-origin: center center;
    transform-box: fill-box;
  }
</style><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>