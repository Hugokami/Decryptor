<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="pulse-layers">
<style>
  @keyframes pulse-layers {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }
  #pulse-layers {
    animation: pulse-layers 2s ease-in-out infinite;
    transform-origin: center center;
    transform-box: fill-box;
  }
</style><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 12 12 17 22 12"/><polyline points="2 17 12 22 22 17"/></svg>