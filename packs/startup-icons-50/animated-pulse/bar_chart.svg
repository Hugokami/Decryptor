<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="pulse-bar_chart">
<style>
  @keyframes pulse-bar_chart {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }
  #pulse-bar_chart {
    animation: pulse-bar_chart 2s ease-in-out infinite;
    transform-origin: center center;
    transform-box: fill-box;
  }
</style><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>