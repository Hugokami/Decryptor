<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="pulse-compass">
<style>
  @keyframes pulse-compass {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }
  #pulse-compass {
    animation: pulse-compass 2s ease-in-out infinite;
    transform-origin: center center;
    transform-box: fill-box;
  }
