<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="pulse-terminal">
<style>
  @keyframes pulse-terminal {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }
  #pulse-terminal {
    animation: pulse-terminal 2s ease-in-out infinite;
    transform-origin: center center;
    transform-box: fill-box;
  }
</style><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>