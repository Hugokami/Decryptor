<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="holo-terminal">
  <defs>
    <linearGradient id="grad-terminal" x1="0%" y1="0%" x2="200%" y2="200%">
      <stop offset="0%" stop-color="#FF0080" />
      <stop offset="33%" stop-color="#7928CA" />
      <stop offset="66%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#00f2fe" />
      <animate attributeName="x1" values="0%;-100%;0%" dur="4s" repeatCount="indefinite" />
      <animate attributeName="y1" values="0%;-100%;0%" dur="4s" repeatCount="indefinite" />
      <animate attributeName="x2" values="200%;100%;200%" dur="4s" repeatCount="indefinite" />
      <animate attributeName="y2" values="200%;100%;200%" dur="4s" repeatCount="indefinite" />
    </linearGradient>
  </defs>
  <style>
    #holo-terminal * {
      stroke: url(#grad-terminal);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
  </style><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></svg>