<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="holo-credit_card">
  <defs>
    <linearGradient id="grad-credit_card" x1="0%" y1="0%" x2="200%" y2="200%">
      <stop offset="0%" stop-color="#FF0080" />
      <stop offset="33%" stop-color="#7928CA" />
      <stop offset="66%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#00f2fe" />
      <animate attributeName="x1" values="0%;-100%;0%" dur="4s" repeatCount="indefinite" />
      <animate attributeName="y1" values="0%;-100%;0%" dur="4s" repeatCount="indefinite" />
      <animate attributeName="x2" values="200%;100%;200%" dur="4s" repeatCount="indefinite" />
      <animate attributeName="y2" values="200%;100%;200%" dur="4s" repeatCount="indefinite" />
    </linearGradient>
  </defs>
  <style>
    #holo-credit_card * {
      stroke: url(#grad-credit_card);
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
  </style><rect x="1" y="4" width="22" height="16" rx="2" ry="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg>