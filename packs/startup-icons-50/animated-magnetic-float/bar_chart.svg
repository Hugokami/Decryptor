<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="float-bar_chart">
  <style>
    @keyframes float-bar_chart {
      0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
      33% { transform: translateY(-4px) rotate(3deg) scale(1.05); }
      66% { transform: translateY(2px) rotate(-2deg) scale(0.98); }
    }
    #float-bar_chart {
      animation: float-bar_chart 4s cubic-bezier(0.45, 0, 0.15, 1) infinite;
      transform-origin: center;
      overflow: visible;
    }
    #float-bar_chart * {
      stroke: currentColor;
      stroke-width: 2;
      transition: stroke 0.3s ease;
    }
  </style><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>