<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="float-share_2">
  <style>
    @keyframes float-share_2 {
      0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
      33% { transform: translateY(-4px) rotate(3deg) scale(1.05); }
      66% { transform: translateY(2px) rotate(-2deg) scale(0.98); }
    }
    #float-share_2 {
      animation: float-share_2 4s cubic-bezier(0.45, 0, 0.15, 1) infinite;
      transform-origin: center;
      overflow: visible;
    }
    #float-share_2 * {
      stroke: currentColor;
      stroke-width: 2;
      transition: stroke 0.3s ease;
    }
