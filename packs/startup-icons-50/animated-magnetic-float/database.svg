<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="float-database">
  <style>
    @keyframes float-database {
      0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
      33% { transform: translateY(-4px) rotate(3deg) scale(1.05); }
      66% { transform: translateY(2px) rotate(-2deg) scale(0.98); }
    }
    #float-database {
      animation: float-database 4s cubic-bezier(0.45, 0, 0.15, 1) infinite;
      transform-origin: center;
      overflow: visible;
    }
    #float-database * {
      stroke: currentColor;
      stroke-width: 2;
      transition: stroke 0.3s ease;
    }
  </style><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>