<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="draw-sliders">
<style>
  @keyframes draw-sliders {
    0% { stroke-dashoffset: var(--path-length); opacity: 0.3; }
    10% { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
  }
  #draw-sliders path, #draw-sliders line, #draw-sliders polyline, #draw-sliders polygon, 
  #draw-sliders rect, #draw-sliders circle, #draw-sliders ellipse {
    stroke: currentColor;
    stroke-width: 1.5;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    animation: draw-sliders 2s ease-out forwards;
  }
</style><line x1="4" y1="21" x2="4" y2="14"/ fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="500" stroke-dashoffset="500" style="animation: draw-sliders 2s ease-out forwards"><line x1="4" y1="10" x2="4" y2="3"/ fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="500" stroke-dashoffset="500" style="animation: draw-sliders 2s ease-out forwards"><line x1="12" y1="21" x2="12" y2="12"/ fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="500" stroke-dashoffset="500" style="animation: draw-sliders 2s ease-out forwards"><line x1="12" y1="8" x2="12" y2="3"/ fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="500" stroke-dashoffset="500" style="animation: draw-sliders 2s ease-out forwards"><line x1="20" y1="21" x2="20" y2="16"/ fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="500" stroke-dashoffset="500" style="animation: draw-sliders 2s ease-out forwards"><line x1="20" y1="12" x2="20" y2="3"/ fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="500" stroke-dashoffset="500" style="animation: draw-sliders 2s ease-out forwards"><line x1="1" y1="14" x2="7" y2="14"/ fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="500" stroke-dashoffset="500" style="animation: draw-sliders 2s ease-out forwards"><line x1="9" y1="8" x2="15" y2="8"/ fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="500" stroke-dashoffset="500" style="animation: draw-sliders 2s ease-out forwards"><line x1="17" y1="16" x2="23" y2="16"/ fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="500" stroke-dashoffset="500" style="animation: draw-sliders 2s ease-out forwards"></svg>