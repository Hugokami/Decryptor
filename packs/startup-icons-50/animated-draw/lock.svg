<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="draw-lock">
<style>
  @keyframes draw-lock {
    0% { stroke-dashoffset: var(--path-length); opacity: 0.3; }
    10% { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
  }
  #draw-lock path, #draw-lock line, #draw-lock polyline, #draw-lock polygon, 
  #draw-lock rect, #draw-lock circle, #draw-lock ellipse {
    stroke: currentColor;
    stroke-width: 1.5;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    animation: draw-lock 2s ease-out forwards;
  }
</style><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/ fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="500" stroke-dashoffset="500" style="animation: draw-lock 2s ease-out forwards"><path d="M7 11V7a5 5 0 0 1 10 0v4"/ fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="500" stroke-dashoffset="500" style="animation: draw-lock 2s ease-out forwards"></svg>