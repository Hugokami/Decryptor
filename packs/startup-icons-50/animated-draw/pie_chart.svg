<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="draw-pie_chart">
<style>
  @keyframes draw-pie_chart {
    0% { stroke-dashoffset: var(--path-length); opacity: 0.3; }
    10% { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
  }
  #draw-pie_chart path, #draw-pie_chart line, #draw-pie_chart polyline, #draw-pie_chart polygon, 
  #draw-pie_chart rect, #draw-pie_chart circle, #draw-pie_chart ellipse {
    stroke: currentColor;
    stroke-width: 1.5;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    animation: draw-pie_chart 2s ease-out forwards;
  }
</style><path d="M21.21 15.89A10 10 0 1 1 8 2.83"/ fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="500" stroke-dashoffset="500" style="animation: draw-pie_chart 2s ease-out forwards"><path d="M22 12A10 10 0 0 0 12 2v10z"/ fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="500" stroke-dashoffset="500" style="animation: draw-pie_chart 2s ease-out forwards"></svg>