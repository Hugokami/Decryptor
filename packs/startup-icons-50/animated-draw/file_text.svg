<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="draw-file_text">
<style>
  @keyframes draw-file_text {
    0% { stroke-dashoffset: var(--path-length); opacity: 0.3; }
    10% { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
  }
  #draw-file_text path, #draw-file_text line, #draw-file_text polyline, #draw-file_text polygon, 
  #draw-file_text rect, #draw-file_text circle, #draw-file_text ellipse {
    stroke: currentColor;
    stroke-width: 1.5;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    animation: draw-file_text 2s ease-out forwards;
  }
