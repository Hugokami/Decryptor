<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="draw-shopping_cart">
<style>
  @keyframes draw-shopping_cart {
    0% { stroke-dashoffset: var(--path-length); opacity: 0.3; }
    10% { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
  }
  #draw-shopping_cart path, #draw-shopping_cart line, #draw-shopping_cart polyline, #draw-shopping_cart polygon, 
  #draw-shopping_cart rect, #draw-shopping_cart circle, #draw-shopping_cart ellipse {
    stroke: currentColor;
    stroke-width: 1.5;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    animation: draw-shopping_cart 2s ease-out forwards;
  }
</style><circle cx="9" cy="21" r="1"/ fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="500" stroke-dashoffset="500" style="animation: draw-shopping_cart 2s ease-out forwards"><circle cx="20" cy="21" r="1"/ fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="500" stroke-dashoffset="500" style="animation: draw-shopping_cart 2s ease-out forwards"><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/ fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="500" stroke-dashoffset="500" style="animation: draw-shopping_cart 2s ease-out forwards"></svg>