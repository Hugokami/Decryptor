<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="draw-grid">
<style>
  @keyframes draw-grid {
    0% { stroke-dashoffset: var(--path-length); opacity: 0.3; }
    10% { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
  }
  #draw-grid path, #draw-grid line, #draw-grid polyline, #draw-grid polygon, 
  #draw-grid rect, #draw-grid circle, #draw-grid ellipse {
    stroke: currentColor;
    stroke-width: 1.5;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    animation: draw-grid 2s ease-out forwards;
  }
</style><rect x="3" y="3" width="7" height="7"/ fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="500" stroke-dashoffset="500" style="animation: draw-grid 2s ease-out forwards"><rect x="14" y="3" width="7" height="7"/ fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="500" stroke-dashoffset="500" style="animation: draw-grid 2s ease-out forwards"><rect x="14" y="14" width="7" height="7"/ fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="500" stroke-dashoffset="500" style="animation: draw-grid 2s ease-out forwards"><rect x="3" y="14" width="7" height="7"/ fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="500" stroke-dashoffset="500" style="animation: draw-grid 2s ease-out forwards"></svg>
