<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="draw-camera">
<style>
  @keyframes draw-camera {
    0% { stroke-dashoffset: var(--path-length); opacity: 0.3; }
    10% { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
  }
  #draw-camera path, #draw-camera line, #draw-camera polyline, #draw-camera polygon, 
  #draw-camera rect, #draw-camera circle, #draw-camera ellipse {
    stroke: currentColor;
    stroke-width: 1.5;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    animation: draw-camera 2s ease-out forwards;
  }
</style><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/ fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="500" stroke-dashoffset="500" style="animation: draw-camera 2s ease-out forwards"><circle cx="12" cy="13" r="4"/ fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="500" stroke-dashoffset="500" style="animation: draw-camera 2s ease-out forwards"></svg>