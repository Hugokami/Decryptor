<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="draw-folder_plus">
<style>
  @keyframes draw-folder_plus {
    0% { stroke-dashoffset: var(--path-length); opacity: 0.3; }
    10% { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
  }
  #draw-folder_plus path, #draw-folder_plus line, #draw-folder_plus polyline, #draw-folder_plus polygon, 
  #draw-folder_plus rect, #draw-folder_plus circle, #draw-folder_plus ellipse {
    stroke: currentColor;
    stroke-width: 1.5;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    animation: draw-folder_plus 2s ease-out forwards;
  }
