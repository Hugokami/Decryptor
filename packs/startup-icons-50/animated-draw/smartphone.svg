<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="draw-smartphone">
<style>
  @keyframes draw-smartphone {
    0% { stroke-dashoffset: var(--path-length); opacity: 0.3; }
    10% { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
  }
  #draw-smartphone path, #draw-smartphone line, #draw-smartphone polyline, #draw-smartphone polygon, 
  #draw-smartphone rect, #draw-smartphone circle, #draw-smartphone ellipse {
    stroke: currentColor;
    stroke-width: 1.5;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    animation: draw-smartphone 2s ease-out forwards;
  }
</style><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/ fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="500" stroke-dashoffset="500" style="animation: draw-smartphone 2s ease-out forwards"><line x1="12" y1="18" x2="12.01" y2="18"/ fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="500" stroke-dashoffset="500" style="animation: draw-smartphone 2s ease-out forwards"></svg>