<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="draw-bluetooth">
<style>
  @keyframes draw-bluetooth {
    0% { stroke-dashoffset: var(--path-length); opacity: 0.3; }
    10% { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
  }
  #draw-bluetooth path, #draw-bluetooth line, #draw-bluetooth polyline, #draw-bluetooth polygon, 
  #draw-bluetooth rect, #draw-bluetooth circle, #draw-bluetooth ellipse {
    stroke: currentColor;
    stroke-width: 1.5;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    animation: draw-bluetooth 2s ease-out forwards;
  }
</style><polyline points="6.5 6.5 17.5 17.5 12 23 12 1 17.5 6.5 6.5 17.5"/ fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="500" stroke-dashoffset="500" style="animation: draw-bluetooth 2s ease-out forwards"></svg>