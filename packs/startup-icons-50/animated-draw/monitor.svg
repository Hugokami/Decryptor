<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="draw-monitor">
<style>
  @keyframes draw-monitor {
    0% { stroke-dashoffset: var(--path-length); opacity: 0.3; }
    10% { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
  }
  #draw-monitor path, #draw-monitor line, #draw-monitor polyline, #draw-monitor polygon, 
  #draw-monitor rect, #draw-monitor circle, #draw-monitor ellipse {
    stroke: currentColor;
    stroke-width: 1.5;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    animation: draw-monitor 2s ease-out forwards;
  }
</style><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/ fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="500" stroke-dashoffset="500" style="animation: draw-monitor 2s ease-out forwards"><line x1="8" y1="21" x2="16" y2="21"/ fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="500" stroke-dashoffset="500" style="animation: draw-monitor 2s ease-out forwards"><line x1="12" y1="17" x2="12" y2="21"/ fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="500" stroke-dashoffset="500" style="animation: draw-monitor 2s ease-out forwards"></svg>
