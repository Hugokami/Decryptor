<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="draw-clock">
<style>
  @keyframes draw-clock {
    0% { stroke-dashoffset: var(--path-length); opacity: 0.3; }
    10% { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
  }
  #draw-clock path, #draw-clock line, #draw-clock polyline, #draw-clock polygon, 
  #draw-clock rect, #draw-clock circle, #draw-clock ellipse {
    stroke: currentColor;
    stroke-width: 1.5;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    animation: draw-clock 2s ease-out forwards;
  }
</style><circle cx="12" cy="12" r="10"/ fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="500" stroke-dashoffset="500" style="animation: draw-clock 2s ease-out forwards"><polyline points="12 6 12 12 16 14"/ fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="500" stroke-dashoffset="500" style="animation: draw-clock 2s ease-out forwards"></svg>
