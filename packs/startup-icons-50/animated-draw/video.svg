<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="draw-video">
<style>
  @keyframes draw-video {
    0% { stroke-dashoffset: var(--path-length); opacity: 0.3; }
    10% { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
  }
  #draw-video path, #draw-video line, #draw-video polyline, #draw-video polygon, 
  #draw-video rect, #draw-video circle, #draw-video ellipse {
    stroke: currentColor;
    stroke-width: 1.5;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    animation: draw-video 2s ease-out forwards;
  }
</style><polygon points="23 7 16 12 23 17 23 7"/ fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="500" stroke-dashoffset="500" style="animation: draw-video 2s ease-out forwards"><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/ fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="500" stroke-dashoffset="500" style="animation: draw-video 2s ease-out forwards"></svg>