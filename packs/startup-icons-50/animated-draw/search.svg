<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="draw-search">
<style>
  @keyframes draw-search {
    0% { stroke-dashoffset: var(--path-length); opacity: 0.3; }
    10% { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
  }
  #draw-search path, #draw-search line, #draw-search polyline, #draw-search polygon, 
  #draw-search rect, #draw-search circle, #draw-search ellipse {
    stroke: currentColor;
    stroke-width: 1.5;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    animation: draw-search 2s ease-out forwards;
  }
</style><circle cx="11" cy="11" r="8"/ fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="500" stroke-dashoffset="500" style="animation: draw-search 2s ease-out forwards"><line x1="21" y1="21" x2="16.65" y2="16.65"/ fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="500" stroke-dashoffset="500" style="animation: draw-search 2s ease-out forwards"></svg>
