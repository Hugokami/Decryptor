<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="draw-wifi">
<style>
  @keyframes draw-wifi {
    0% { stroke-dashoffset: var(--path-length); opacity: 0.3; }
    10% { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
  }
  #draw-wifi path, #draw-wifi line, #draw-wifi polyline, #draw-wifi polygon, 
  #draw-wifi rect, #draw-wifi circle, #draw-wifi ellipse {
    stroke: currentColor;
    stroke-width: 1.5;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    animation: draw-wifi 2s ease-out forwards;
  }
</style><path d="M5 12.55a11 11 0 0 1 14.08 0"/ fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="500" stroke-dashoffset="500" style="animation: draw-wifi 2s ease-out forwards"><path d="M1.42 9a16 16 0 0 1 21.16 0"/ fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="500" stroke-dashoffset="500" style="animation: draw-wifi 2s ease-out forwards"><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/ fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="500" stroke-dashoffset="500" style="animation: draw-wifi 2s ease-out forwards"><line x1="12" y1="20" x2="12.01" y2="20"/ fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="500" stroke-dashoffset="500" style="animation: draw-wifi 2s ease-out forwards"></svg>