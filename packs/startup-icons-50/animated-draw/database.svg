<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="draw-database">
<style>
  @keyframes draw-database {
    0% { stroke-dashoffset: var(--path-length); opacity: 0.3; }
    10% { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
  }
  #draw-database path, #draw-database line, #draw-database polyline, #draw-database polygon, 
  #draw-database rect, #draw-database circle, #draw-database ellipse {
    stroke: currentColor;
    stroke-width: 1.5;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    animation: draw-database 2s ease-out forwards;
  }
</style><ellipse cx="12" cy="5" rx="9" ry="3"/ fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="500" stroke-dashoffset="500" style="animation: draw-database 2s ease-out forwards"><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/ fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="500" stroke-dashoffset="500" style="animation: draw-database 2s ease-out forwards"><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/ fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="500" stroke-dashoffset="500" style="animation: draw-database 2s ease-out forwards"></svg>