<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="draw-unlock">
<style>
  @keyframes draw-unlock {
    0% { stroke-dashoffset: var(--path-length); opacity: 0.3; }
    10% { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
  }
  #draw-unlock path, #draw-unlock line, #draw-unlock polyline, #draw-unlock polygon, 
  #draw-unlock rect, #draw-unlock circle, #draw-unlock ellipse {
    stroke: currentColor;
    stroke-width: 1.5;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    animation: draw-unlock 2s ease-out forwards;
  }
</style><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/ fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="500" stroke-dashoffset="500" style="animation: draw-unlock 2s ease-out forwards"><path d="M7 11V7a5 5 0 0 1 9.9-1"/ fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="500" stroke-dashoffset="500" style="animation: draw-unlock 2s ease-out forwards"></svg>