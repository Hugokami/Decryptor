<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="draw-home">
<style>
  @keyframes draw-home {
    0% { stroke-dashoffset: var(--path-length); opacity: 0.3; }
    10% { opacity: 1; }
    100% { stroke-dashoffset: 0; opacity: 1; }
  }
  #draw-home path, #draw-home line, #draw-home polyline, #draw-home polygon, 
  #draw-home rect, #draw-home circle, #draw-home ellipse {
    stroke: currentColor;
    stroke-width: 1.5;
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
    animation: draw-home 2s ease-out forwards;
  }
