<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="neon-hexagon">
  <defs>
    <filter id="glow-hexagon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    @keyframes neon-hexagon {
      0% { stroke-dashoffset: var(--pl, 100); opacity: 0; filter: none; }
      30% { opacity: 1; }
      80% { filter: url(#glow-hexagon); }
      100% { stroke-dashoffset: 0; filter: url(#glow-hexagon); opacity: 1; }
    }
    #neon-hexagon path, #neon-hexagon line, #neon-hexagon polyline, #neon-hexagon polygon, 
    #neon-hexagon rect, #neon-hexagon circle, #neon-hexagon ellipse {
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      animation: neon-hexagon 1.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }
  </style><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"></svg>