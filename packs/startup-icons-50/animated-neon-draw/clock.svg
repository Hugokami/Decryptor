<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="neon-clock">
  <defs>
    <filter id="glow-clock" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    @keyframes neon-clock {
      0% { stroke-dashoffset: var(--pl, 100); opacity: 0; filter: none; }
      30% { opacity: 1; }
      80% { filter: url(#glow-clock); }
      100% { stroke-dashoffset: 0; filter: url(#glow-clock); opacity: 1; }
    }
    #neon-clock path, #neon-clock line, #neon-clock polyline, #neon-clock polygon, 
    #neon-clock rect, #neon-clock circle, #neon-clock ellipse {
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      animation: neon-clock 1.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }
  </style><circle cx="12" cy="12" r="10"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"><polyline points="12 6 12 12 16 14"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"></svg>
