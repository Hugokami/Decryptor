<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="neon-terminal">
  <defs>
    <filter id="glow-terminal" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    @keyframes neon-terminal {
      0% { stroke-dashoffset: var(--pl, 100); opacity: 0; filter: none; }
      30% { opacity: 1; }
      80% { filter: url(#glow-terminal); }
      100% { stroke-dashoffset: 0; filter: url(#glow-terminal); opacity: 1; }
    }
    #neon-terminal path, #neon-terminal line, #neon-terminal polyline, #neon-terminal polygon, 
    #neon-terminal rect, #neon-terminal circle, #neon-terminal ellipse {
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      animation: neon-terminal 1.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }
  </style><polyline points="4 17 10 11 4 5"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"><line x1="12" y1="19" x2="20" y2="19"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"></svg>