<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="neon-share_2">
  <defs>
    <filter id="glow-share_2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    @keyframes neon-share_2 {
      0% { stroke-dashoffset: var(--pl, 100); opacity: 0; filter: none; }
      30% { opacity: 1; }
      80% { filter: url(#glow-share_2); }
      100% { stroke-dashoffset: 0; filter: url(#glow-share_2); opacity: 1; }
    }
    #neon-share_2 path, #neon-share_2 line, #neon-share_2 polyline, #neon-share_2 polygon, 
    #neon-share_2 rect, #neon-share_2 circle, #neon-share_2 ellipse {
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      animation: neon-share_2 1.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }
  </style><circle cx="18" cy="5" r="3"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"><circle cx="6" cy="12" r="3"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"><circle cx="18" cy="19" r="3"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"></svg>