<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="neon-key">
  <defs>
    <filter id="glow-key" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    @keyframes neon-key {
      0% { stroke-dashoffset: var(--pl, 100); opacity: 0; filter: none; }
      30% { opacity: 1; }
      80% { filter: url(#glow-key); }
      100% { stroke-dashoffset: 0; filter: url(#glow-key); opacity: 1; }
    }
    #neon-key path, #neon-key line, #neon-key polyline, #neon-key polygon, 
    #neon-key rect, #neon-key circle, #neon-key ellipse {
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      animation: neon-key 1.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }
  </style><path d="m15.5 7.5 2.3 2.3a1 1 0 0 0 1.4 0l2.1-2.1a1 1 0 0 0 0-1.4L19 4"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"><path d="m21 2-9.6 9.6"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"><circle cx="7.5" cy="15.5" r="5.5"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"></svg>