<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="neon-wifi">
  <defs>
    <filter id="glow-wifi" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    @keyframes neon-wifi {
      0% { stroke-dashoffset: var(--pl, 100); opacity: 0; filter: none; }
      30% { opacity: 1; }
      80% { filter: url(#glow-wifi); }
      100% { stroke-dashoffset: 0; filter: url(#glow-wifi); opacity: 1; }
    }
    #neon-wifi path, #neon-wifi line, #neon-wifi polyline, #neon-wifi polygon, 
    #neon-wifi rect, #neon-wifi circle, #neon-wifi ellipse {
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      animation: neon-wifi 1.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }
  </style><path d="M5 12.55a11 11 0 0 1 14.08 0"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"><path d="M1.42 9a16 16 0 0 1 21.16 0"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"><line x1="12" y1="20" x2="12.01" y2="20"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"></svg>