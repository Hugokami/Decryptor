<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="neon-user">
  <defs>
    <filter id="glow-user" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    @keyframes neon-user {
      0% { stroke-dashoffset: var(--pl, 100); opacity: 0; filter: none; }
      30% { opacity: 1; }
      80% { filter: url(#glow-user); }
      100% { stroke-dashoffset: 0; filter: url(#glow-user); opacity: 1; }
    }
    #neon-user path, #neon-user line, #neon-user polyline, #neon-user polygon, 
    #neon-user rect, #neon-user circle, #neon-user ellipse {
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      animation: neon-user 1.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }
  </style><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"><circle cx="12" cy="7" r="4"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"></svg>
