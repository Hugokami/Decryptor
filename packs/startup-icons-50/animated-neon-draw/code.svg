<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="neon-code">
  <defs>
    <filter id="glow-code" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    @keyframes neon-code {
      0% { stroke-dashoffset: var(--pl, 100); opacity: 0; filter: none; }
      30% { opacity: 1; }
      80% { filter: url(#glow-code); }
      100% { stroke-dashoffset: 0; filter: url(#glow-code); opacity: 1; }
    }
    #neon-code path, #neon-code line, #neon-code polyline, #neon-code polygon, 
    #neon-code rect, #neon-code circle, #neon-code ellipse {
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      animation: neon-code 1.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }
  </style><polyline points="16 18 22 12 16 6"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"><polyline points="8 6 2 12 8 18"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"></svg>