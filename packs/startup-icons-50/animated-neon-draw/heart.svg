<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="neon-heart">
  <defs>
    <filter id="glow-heart" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    @keyframes neon-heart {
      0% { stroke-dashoffset: var(--pl, 100); opacity: 0; filter: none; }
      30% { opacity: 1; }
      80% { filter: url(#glow-heart); }
      100% { stroke-dashoffset: 0; filter: url(#glow-heart); opacity: 1; }
    }
    #neon-heart path, #neon-heart line, #neon-heart polyline, #neon-heart polygon, 
    #neon-heart rect, #neon-heart circle, #neon-heart ellipse {
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      animation: neon-heart 1.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }
  </style><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"></svg>
