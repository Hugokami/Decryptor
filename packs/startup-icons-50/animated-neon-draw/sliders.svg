<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="neon-sliders">
  <defs>
    <filter id="glow-sliders" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    @keyframes neon-sliders {
      0% { stroke-dashoffset: var(--pl, 100); opacity: 0; filter: none; }
      30% { opacity: 1; }
      80% { filter: url(#glow-sliders); }
      100% { stroke-dashoffset: 0; filter: url(#glow-sliders); opacity: 1; }
    }
    #neon-sliders path, #neon-sliders line, #neon-sliders polyline, #neon-sliders polygon, 
    #neon-sliders rect, #neon-sliders circle, #neon-sliders ellipse {
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      animation: neon-sliders 1.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }
  </style><line x1="4" y1="21" x2="4" y2="14"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"><line x1="4" y1="10" x2="4" y2="3"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"><line x1="12" y1="21" x2="12" y2="12"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"><line x1="12" y1="8" x2="12" y2="3"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"><line x1="20" y1="21" x2="20" y2="16"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"><line x1="20" y1="12" x2="20" y2="3"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"><line x1="1" y1="14" x2="7" y2="14"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"><line x1="9" y1="8" x2="15" y2="8"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"><line x1="17" y1="16" x2="23" y2="16"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"></svg>