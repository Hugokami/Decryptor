<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="neon-home">
  <defs>
    <filter id="glow-home" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    @keyframes neon-home {
      0% { stroke-dashoffset: var(--pl, 100); opacity: 0; filter: none; }
      30% { opacity: 1; }
      80% { filter: url(#glow-home); }
      100% { stroke-dashoffset: 0; filter: url(#glow-home); opacity: 1; }
    }
    #neon-home path, #neon-home line, #neon-home polyline, #neon-home polygon, 
    #neon-home rect, #neon-home circle, #neon-home ellipse {
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      animation: neon-home 1.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }
  </style><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"><polyline points="9 22 9 12 15 12 15 22"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"></svg>
