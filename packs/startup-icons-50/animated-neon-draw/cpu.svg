<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="neon-cpu">
  <defs>
    <filter id="glow-cpu" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    @keyframes neon-cpu {
      0% { stroke-dashoffset: var(--pl, 100); opacity: 0; filter: none; }
      30% { opacity: 1; }
      80% { filter: url(#glow-cpu); }
      100% { stroke-dashoffset: 0; filter: url(#glow-cpu); opacity: 1; }
    }
    #neon-cpu path, #neon-cpu line, #neon-cpu polyline, #neon-cpu polygon, 
    #neon-cpu rect, #neon-cpu circle, #neon-cpu ellipse {
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      animation: neon-cpu 1.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }
  </style><rect x="4" y="4" width="16" height="16" rx="2" ry="2"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"><rect x="9" y="9" width="6" height="6"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"><line x1="9" y1="1" x2="9" y2="4"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"><line x1="15" y1="1" x2="15" y2="4"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"><line x1="9" y1="20" x2="9" y2="23"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"><line x1="15" y1="20" x2="15" y2="23"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"><line x1="20" y1="9" x2="23" y2="9"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"><line x1="20" y1="14" x2="23" y2="14"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"><line x1="1" y1="9" x2="4" y2="9"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"><line x1="1" y1="14" x2="4" y2="14"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"></svg>