<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="neon-smartphone">
  <defs>
    <filter id="glow-smartphone" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    @keyframes neon-smartphone {
      0% { stroke-dashoffset: var(--pl, 100); opacity: 0; filter: none; }
      30% { opacity: 1; }
      80% { filter: url(#glow-smartphone); }
      100% { stroke-dashoffset: 0; filter: url(#glow-smartphone); opacity: 1; }
    }
    #neon-smartphone path, #neon-smartphone line, #neon-smartphone polyline, #neon-smartphone polygon, 
    #neon-smartphone rect, #neon-smartphone circle, #neon-smartphone ellipse {
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      animation: neon-smartphone 1.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }
  </style><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"><line x1="12" y1="18" x2="12.01" y2="18"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"></svg>