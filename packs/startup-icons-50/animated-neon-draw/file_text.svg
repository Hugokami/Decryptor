<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="neon-file_text">
  <defs>
    <filter id="glow-file_text" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    @keyframes neon-file_text {
      0% { stroke-dashoffset: var(--pl, 100); opacity: 0; filter: none; }
      30% { opacity: 1; }
      80% { filter: url(#glow-file_text); }
      100% { stroke-dashoffset: 0; filter: url(#glow-file_text); opacity: 1; }
    }
    #neon-file_text path, #neon-file_text line, #neon-file_text polyline, #neon-file_text polygon, 
    #neon-file_text rect, #neon-file_text circle, #neon-file_text ellipse {
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      animation: neon-file_text 1.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }
  </style><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"><polyline points="14 2 14 8 20 8"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"><line x1="16" y1="13" x2="8" y2="13"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"><line x1="16" y1="17" x2="8" y2="17"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"><polyline points="10 9 9 9 8 9"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"></svg>