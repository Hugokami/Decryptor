<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="neon-layers">
  <defs>
    <filter id="glow-layers" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    @keyframes neon-layers {
      0% { stroke-dashoffset: var(--pl, 100); opacity: 0; filter: none; }
      30% { opacity: 1; }
      80% { filter: url(#glow-layers); }
      100% { stroke-dashoffset: 0; filter: url(#glow-layers); opacity: 1; }
    }
    #neon-layers path, #neon-layers line, #neon-layers polyline, #neon-layers polygon, 
    #neon-layers rect, #neon-layers circle, #neon-layers ellipse {
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      animation: neon-layers 1.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }
  </style><polygon points="12 2 2 7 12 12 22 7 12 2"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"><polyline points="2 12 12 17 22 12"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"><polyline points="2 17 12 22 22 17"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"></svg>