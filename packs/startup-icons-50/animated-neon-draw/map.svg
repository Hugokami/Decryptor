<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="neon-map">
  <defs>
    <filter id="glow-map" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    @keyframes neon-map {
      0% { stroke-dashoffset: var(--pl, 100); opacity: 0; filter: none; }
      30% { opacity: 1; }
      80% { filter: url(#glow-map); }
      100% { stroke-dashoffset: 0; filter: url(#glow-map); opacity: 1; }
    }
    #neon-map path, #neon-map line, #neon-map polyline, #neon-map polygon, 
    #neon-map rect, #neon-map circle, #neon-map ellipse {
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      animation: neon-map 1.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }
  </style><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"><line x1="8" y1="2" x2="8" y2="18"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"><line x1="16" y1="6" x2="16" y2="22"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"></svg>