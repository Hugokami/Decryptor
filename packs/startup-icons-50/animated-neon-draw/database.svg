<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="neon-database">
  <defs>
    <filter id="glow-database" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    @keyframes neon-database {
      0% { stroke-dashoffset: var(--pl, 100); opacity: 0; filter: none; }
      30% { opacity: 1; }
      80% { filter: url(#glow-database); }
      100% { stroke-dashoffset: 0; filter: url(#glow-database); opacity: 1; }
    }
    #neon-database path, #neon-database line, #neon-database polyline, #neon-database polygon, 
    #neon-database rect, #neon-database circle, #neon-database ellipse {
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      animation: neon-database 1.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }
  </style><ellipse cx="12" cy="5" rx="9" ry="3"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"></svg>