<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="neon-cloud_upload">
  <defs>
    <filter id="glow-cloud_upload" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    @keyframes neon-cloud_upload {
      0% { stroke-dashoffset: var(--pl, 100); opacity: 0; filter: none; }
      30% { opacity: 1; }
      80% { filter: url(#glow-cloud_upload); }
      100% { stroke-dashoffset: 0; filter: url(#glow-cloud_upload); opacity: 1; }
    }
    #neon-cloud_upload path, #neon-cloud_upload line, #neon-cloud_upload polyline, #neon-cloud_upload polygon, 
    #neon-cloud_upload rect, #neon-cloud_upload circle, #neon-cloud_upload ellipse {
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      animation: neon-cloud_upload 1.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }
  </style><path d="M20 16.2A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.2"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"><polyline points="16 16 12 12 8 16"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"><line x1="12" y1="12" x2="12" y2="21"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"></svg>