<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="neon-folder_plus">
  <defs>
    <filter id="glow-folder_plus" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    @keyframes neon-folder_plus {
      0% { stroke-dashoffset: var(--pl, 100); opacity: 0; filter: none; }
      30% { opacity: 1; }
      80% { filter: url(#glow-folder_plus); }
      100% { stroke-dashoffset: 0; filter: url(#glow-folder_plus); opacity: 1; }
    }
    #neon-folder_plus path, #neon-folder_plus line, #neon-folder_plus polyline, #neon-folder_plus polygon, 
    #neon-folder_plus rect, #neon-folder_plus circle, #neon-folder_plus ellipse {
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      animation: neon-folder_plus 1.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }
  </style><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"><line x1="12" y1="11" x2="12" y2="17"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"><line x1="9" y1="14" x2="15" y2="14"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"></svg>