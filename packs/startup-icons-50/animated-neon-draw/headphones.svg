<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="neon-headphones">
  <defs>
    <filter id="glow-headphones" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    @keyframes neon-headphones {
      0% { stroke-dashoffset: var(--pl, 100); opacity: 0; filter: none; }
      30% { opacity: 1; }
      80% { filter: url(#glow-headphones); }
      100% { stroke-dashoffset: 0; filter: url(#glow-headphones); opacity: 1; }
    }
    #neon-headphones path, #neon-headphones line, #neon-headphones polyline, #neon-headphones polygon, 
    #neon-headphones rect, #neon-headphones circle, #neon-headphones ellipse {
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      animation: neon-headphones 1.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }
  </style><path d="M3 18v-6a9 9 0 0 1 18 0v6"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"></svg>