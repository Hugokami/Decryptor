<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="neon-link">
  <defs>
    <filter id="glow-link" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    @keyframes neon-link {
      0% { stroke-dashoffset: var(--pl, 100); opacity: 0; filter: none; }
      30% { opacity: 1; }
      80% { filter: url(#glow-link); }
      100% { stroke-dashoffset: 0; filter: url(#glow-link); opacity: 1; }
    }
    #neon-link path, #neon-link line, #neon-link polyline, #neon-link polygon, 
    #neon-link rect, #neon-link circle, #neon-link ellipse {
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      animation: neon-link 1.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }
  </style><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"></svg>