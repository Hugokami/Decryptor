<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="neon-download">
  <defs>
    <filter id="glow-download" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    @keyframes neon-download {
      0% { stroke-dashoffset: var(--pl, 100); opacity: 0; filter: none; }
      30% { opacity: 1; }
      80% { filter: url(#glow-download); }
      100% { stroke-dashoffset: 0; filter: url(#glow-download); opacity: 1; }
    }
    #neon-download path, #neon-download line, #neon-download polyline, #neon-download polygon, 
    #neon-download rect, #neon-download circle, #neon-download ellipse {
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      animation: neon-download 1.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }
  </style><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"><polyline points="7 10 12 15 17 10"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"><line x1="12" y1="15" x2="12" y2="3"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"></svg>