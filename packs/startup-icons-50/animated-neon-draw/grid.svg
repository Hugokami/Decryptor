<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="neon-grid">
  <defs>
    <filter id="glow-grid" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    @keyframes neon-grid {
      0% { stroke-dashoffset: var(--pl, 100); opacity: 0; filter: none; }
      30% { opacity: 1; }
      80% { filter: url(#glow-grid); }
      100% { stroke-dashoffset: 0; filter: url(#glow-grid); opacity: 1; }
    }
    #neon-grid path, #neon-grid line, #neon-grid polyline, #neon-grid polygon, 
    #neon-grid rect, #neon-grid circle, #neon-grid ellipse {
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      animation: neon-grid 1.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }
  </style><rect x="3" y="3" width="7" height="7"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"><rect x="14" y="3" width="7" height="7"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"><rect x="14" y="14" width="7" height="7"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"><rect x="3" y="14" width="7" height="7"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"></svg>
