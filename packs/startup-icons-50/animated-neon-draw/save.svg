<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="neon-save">
  <defs>
    <filter id="glow-save" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    @keyframes neon-save {
      0% { stroke-dashoffset: var(--pl, 100); opacity: 0; filter: none; }
      30% { opacity: 1; }
      80% { filter: url(#glow-save); }
      100% { stroke-dashoffset: 0; filter: url(#glow-save); opacity: 1; }
    }
    #neon-save path, #neon-save line, #neon-save polyline, #neon-save polygon, 
    #neon-save rect, #neon-save circle, #neon-save ellipse {
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      animation: neon-save 1.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }
  </style><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"><polyline points="17 21 17 13 7 13 7 21"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"><polyline points="7 3 7 8 15 8"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"></svg>