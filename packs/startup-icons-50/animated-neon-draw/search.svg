<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="neon-search">
  <defs>
    <filter id="glow-search" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    @keyframes neon-search {
      0% { stroke-dashoffset: var(--pl, 100); opacity: 0; filter: none; }
      30% { opacity: 1; }
      80% { filter: url(#glow-search); }
      100% { stroke-dashoffset: 0; filter: url(#glow-search); opacity: 1; }
    }
    #neon-search path, #neon-search line, #neon-search polyline, #neon-search polygon, 
    #neon-search rect, #neon-search circle, #neon-search ellipse {
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      animation: neon-search 1.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }
  </style><circle cx="11" cy="11" r="8"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"><line x1="21" y1="21" x2="16.65" y2="16.65"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"></svg>
