<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="neon-moon">
  <defs>
    <filter id="glow-moon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    @keyframes neon-moon {
      0% { stroke-dashoffset: var(--pl, 100); opacity: 0; filter: none; }
      30% { opacity: 1; }
      80% { filter: url(#glow-moon); }
      100% { stroke-dashoffset: 0; filter: url(#glow-moon); opacity: 1; }
    }
    #neon-moon path, #neon-moon line, #neon-moon polyline, #neon-moon polygon, 
    #neon-moon rect, #neon-moon circle, #neon-moon ellipse {
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      animation: neon-moon 1.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }
  </style><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"></svg>