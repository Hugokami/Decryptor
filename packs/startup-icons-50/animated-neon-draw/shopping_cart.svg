<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="neon-shopping_cart">
  <defs>
    <filter id="glow-shopping_cart" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    @keyframes neon-shopping_cart {
      0% { stroke-dashoffset: var(--pl, 100); opacity: 0; filter: none; }
      30% { opacity: 1; }
      80% { filter: url(#glow-shopping_cart); }
      100% { stroke-dashoffset: 0; filter: url(#glow-shopping_cart); opacity: 1; }
    }
    #neon-shopping_cart path, #neon-shopping_cart line, #neon-shopping_cart polyline, #neon-shopping_cart polygon, 
    #neon-shopping_cart rect, #neon-shopping_cart circle, #neon-shopping_cart ellipse {
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      animation: neon-shopping_cart 1.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }
  </style><circle cx="9" cy="21" r="1"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"><circle cx="20" cy="21" r="1"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"></svg>