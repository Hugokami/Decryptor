<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="neon-camera">
  <defs>
    <filter id="glow-camera" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    @keyframes neon-camera {
      0% { stroke-dashoffset: var(--pl, 100); opacity: 0; filter: none; }
      30% { opacity: 1; }
      80% { filter: url(#glow-camera); }
      100% { stroke-dashoffset: 0; filter: url(#glow-camera); opacity: 1; }
    }
    #neon-camera path, #neon-camera line, #neon-camera polyline, #neon-camera polygon, 
    #neon-camera rect, #neon-camera circle, #neon-camera ellipse {
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      animation: neon-camera 1.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }
  </style><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"><circle cx="12" cy="13" r="4"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"></svg>