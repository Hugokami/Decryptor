<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" id="neon-monitor">
  <defs>
    <filter id="glow-monitor" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <style>
    @keyframes neon-monitor {
      0% { stroke-dashoffset: var(--pl, 100); opacity: 0; filter: none; }
      30% { opacity: 1; }
      80% { filter: url(#glow-monitor); }
      100% { stroke-dashoffset: 0; filter: url(#glow-monitor); opacity: 1; }
    }
    #neon-monitor path, #neon-monitor line, #neon-monitor polyline, #neon-monitor polygon, 
    #neon-monitor rect, #neon-monitor circle, #neon-monitor ellipse {
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      animation: neon-monitor 1.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }
  </style><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"><line x1="8" y1="21" x2="16" y2="21"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"><line x1="12" y1="17" x2="12" y2="21"/ style="--pl: 150; stroke-dasharray: 150; stroke-dashoffset: 150;"></svg>
